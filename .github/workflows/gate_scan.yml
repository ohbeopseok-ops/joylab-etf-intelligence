name: Gate Scan Alerts

# This file lives on main only because GitHub Actions' `schedule` trigger
# reads workflow YAML exclusively from the default branch. It does not
# touch main's app code -- every step below checks out dev/v0.2 and runs
# scripts/gate_scanner.py from there, and the state commit at the end
# pushes back to dev/v0.2, never to main.

on:
  schedule:
    # Every 30 min, 09:00-15:30 KST (00:00-06:30 UTC), Mon-Fri.
    - cron: "0,30 0-6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run gate scanner
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: ${{ secrets.KIS_ENV }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
        run: python scripts/gate_scanner.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/gate_state.json
          git diff --cached --quiet || git commit -m "chore: update gate scan state [skip ci]"
          git push origin HEAD:dev/v0.2
