name: KIS Realtime V0.2 CI
on:
  push:
    branches: [feature/kis-realtime-market-v0.2]
    paths: ['realtime/**','.github/workflows/kis-realtime-ci.yml']
  pull_request:
    paths: ['realtime/**','.github/workflows/kis-realtime-ci.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: pytest -q
  windows-smoke:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: pytest -q
